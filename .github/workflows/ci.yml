name: ci
on: [push, pull_request]
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - name: crash test (smoke)
        run: go build -o bin/crashtest ./cmd/crashtest && ./bin/crashtest -runs 100 -seed 1
      - name: injected bugs must be caught
        run: python3 scripts/mutation_check.py --crash-runs 300
