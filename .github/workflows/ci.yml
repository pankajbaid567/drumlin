name: ci
on: [push, pull_request]
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - name: tests (race detector)
        run: |
          set +e
          go test -race -count=1 ./... 2>&1 | tee /tmp/test.log
          rc=${PIPESTATUS[0]}
          if [ $rc -ne 0 ]; then
            # surface the reason as public annotations (job logs need a login to read)
            grep -E "^(--- FAIL|FAIL|panic|WARNING: DATA RACE)|_test.go:[0-9]+" -A3 /tmp/test.log | head -40 | sed 's/^/::error::/'
          fi
          exit $rc
      - name: crash test (smoke)
        run: go build -o bin/crashtest ./cmd/crashtest && ./bin/crashtest -runs 100 -seed 1
      - name: injected bugs must be caught
        run: python3 scripts/mutation_check.py --crash-runs 300
